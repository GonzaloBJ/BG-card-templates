<article class="card front">
  <div class="card-content">
    <div class="front-layout" style="grid-template-columns: 1fr !important">
      <style>
        .front .front-columns {
          gap: 0 !important;
          grid-template-columns: none !important;
        }

        .section-block {
          padding: 0 !important;
          gap: 0 !important;
        }

        .section-title,
        .cg-cell {
          font-size: 2mm !important;
        }

        .equipment-content {
          font-size: 2.2mm !important;
        }

        .stat-cell {
          font-size: 3 !important;
        }

        .subtitle {
          text-align: center !important;
          width: auto !important;
          ;
        }

        .cg-cell {
          border-bottom: none !important;
        }

        .right-column>.section:last-child {
          margin-top: auto !important;
          margin-bottom: 0 !important;
        }

        /* --- ESPACIO CALADO (Mitad inferior pegada al borde superior de la carta) --- */
        .slot-cutout {
          width: 68mm;
          height: 22mm;
          /* Mitad de la altura original de 44mm */
          margin: 0 auto;
          border-left: 0.4mm dashed var(--ink);
          border-right: 0.4mm dashed var(--ink);
          border-bottom: 0.4mm dashed var(--ink);
          border-top: none;
          /* Pegado al borde superior de la carta */
          /* background: rgba(255, 255, 255, 0.6); */
          border-radius: 0 0 1mm 1mm;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 1mm;
          flex-shrink: 0;
        }

        .slot-cutout-text {
          font-family: var(--font-title);
          font-size: 1.9mm;
          font-weight: 700;
          text-transform: uppercase;
          color: #555;
          letter-spacing: 0.2mm;
          line-height: 1.2;
        }
      </style>
      <div class="front-main">
        <div class="card-content">
          <!-- ESPACIO CALADO SUPERIOR (Mitad inferior, pegado arriba) -->
          <div class="slot-cutout">
            <span class="slot-cutout-text">{{ frontCard.sections.enemySlot }}</span>
          </div>
          <div class="title">{{ frontCard.title }}</div>
          <!-- CUADRÍCULA DE TRACKEO (Atributos en columnas, Filas numeradas 1 a 6, Celdas de 8x8mm) -->
          <div class="track-table">
            <!-- Fila de Cabecera: Iconos de Atributos -->
            <div class="corner-empty"></div>
            <div class="track-header-cell">❤️</div>
            <div class="track-header-cell">🛡️</div>
            <div class="track-header-cell">⚔️</div>
            <div class="track-header-cell">👤</div>
            <div class="track-header-cell">💀</div>
            <div class="track-header-cell">⭐</div>

            <!-- Filas de slots -->
            {{ frontCard.sections.unitSlotsRows }}
          </div>
        </div>

      </div>
    </div>
  </div>
</article>
